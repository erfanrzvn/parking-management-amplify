  # Lambda for checkAvailability
  CheckAvailabilityLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - appsync.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ParkingConfigTable.Arn
                  - !GetAtt ReservationTable.Arn
                  - !Sub '${ReservationTable.Arn}/index/*'
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:ca-central-1:103103683543:function:parking-checkAvailability'

  CheckAvailabilityLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: parking-checkAvailability
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt CheckAvailabilityLambdaRole.Arn
      Environment:
        Variables:
          PARKING_CONFIG_TABLE: !Ref ParkingConfigTable
          RESERVATION_TABLE: !Ref ReservationTable
          AWS_REGION_NAME: !Ref AWS::Region
      Code:
        ZipFile: |
          const { DynamoDBClient, ScanCommand, GetItemCommand } = require('@aws-sdk/client-dynamodb');
          const { unmarshall } = require('@aws-sdk/util-dynamodb');
          
          const dynamodb = new DynamoDBClient({});
          
          exports.handler = async (event) => {
            try {
              const now = new Date().toISOString();
              
              // Get total spots
              const configScan = await dynamodb.send(new ScanCommand({
                TableName: process.env.PARKING_CONFIG_TABLE,
                Limit: 1
              }));
              
              const totalSpots = configScan.Items?.[0] ? unmarshall(configScan.Items[0]).totalSpots : 10;
              
              // Get active reservations
              const reservationScan = await dynamodb.send(new ScanCommand({
                TableName: process.env.RESERVATION_TABLE,
                FilterExpression: 'endTime > :now',
                ExpressionAttributeValues: {
                  ':now': { S: now }
                }
              }));
              
              const activeReservations = reservationScan.Items?.length || 0;
              const availableSpots = totalSpots - activeReservations;
              const available = availableSpots > 0;
              
              let nextAvailableTime = null;
              let message = '';
              
              if (available) {
                message = `${availableSpots} parking spot(s) available`;
              } else {
                // Find earliest endTime
                const allReservations = await dynamodb.send(new ScanCommand({
                  TableName: process.env.RESERVATION_TABLE
                }));
                
                if (allReservations.Items?.length) {
                  const times = allReservations.Items
                    .map(item => unmarshall(item).endTime)
                    .filter(time => time > now)
                    .sort();
                  nextAvailableTime = times[0] || null;
                  message = `Parking full. Next available: ${nextAvailableTime}`;
                } else {
                  message = 'Parking full';
                }
              }
              
              return {
                available,
                availableSpots,
                totalSpots,
                nextAvailableTime,
                message
              };
            } catch (error) {
              console.error('Error:', error);
              throw error;
            }
          };

