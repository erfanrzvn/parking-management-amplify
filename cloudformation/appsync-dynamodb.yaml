                  - !GetAtt RateLimitTable.Arn
                  - !GetAtt AuditLogTable.Arn
                  - !Sub '${ReservationTable.Arn}/index/*'
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:ca-central-1:103103683543:function:parking-createReservation'

  CreateReservationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: parking-createReservation
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt CreateReservationLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          PARKING_CONFIG_TABLE: !Ref ParkingConfigTable
          RESIDENT_TABLE: !Ref ResidentTable
          RESERVATION_TABLE: !Ref ReservationTable
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          AWS_REGION_NAME: !Ref AWS::Region
      Code:
        ZipFile: |
          const { DynamoDBClient, ScanCommand, PutItemCommand, QueryCommand } = require('@aws-sdk/client-dynamodb');
          const { marshall, unmarshall } = require('@aws-sdk/util-dynamodb');
          
          const dynamodb = new DynamoDBClient({});
          
          const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          const validatePhone = (phone) => /^\+?[1-9]\d{1,14}$/.test(phone);
          const validatePlate = (plate) => /^[A-Z0-9-]{3,15}$/.test(plate);
          
          exports.handler = async (event) => {
            console.log('CreateReservation input:', JSON.stringify(event));
            
            try {
              const input = event.arguments.input;
              const now = new Date();
              const nowISO = now.toISOString();
              
              // Always use current time as start time (ignore input.startTime)
              const startTime = now;
              const endTime = new Date(input.endTime);
              
              // Validation 1: Duration check
              const durationHours = (endTime - startTime) / (1000 * 60 * 60);
              
              if (durationHours <= 0) {
                throw new Error('Duration must be greater than 0');
              }
              
              if (durationHours > 24) {
                throw new Error('Maximum parking duration is 24 hours');
              }
              
              // Validation 3: Format validation
              if (!validateEmail(input.guestEmail)) {
                throw new Error('Invalid email format');
              }
              
              if (!validatePhone(input.guestMobile)) {
                throw new Error('Invalid phone format (use international format: +1234567890)');
              }
              
              if (!validatePlate(input.guestPlate)) {
                throw new Error('Invalid license plate format');
              }
              
              // Validation 4: Check parking availability
              const parkingScan = await dynamodb.send(new ScanCommand({
                TableName: process.env.PARKING_CONFIG_TABLE,
                Limit: 1
              }));
              
              const totalSpots = parkingScan.Items?.[0] ? unmarshall(parkingScan.Items[0]).totalSpots : 10;
              
              // Get active reservations
              const reservationScan = await dynamodb.send(new ScanCommand({
                TableName: process.env.RESERVATION_TABLE,
                FilterExpression: 'endTime > :now',
                ExpressionAttributeValues: marshall({
                  ':now': nowISO
                })
              }));
              
              const activeReservations = reservationScan.Items?.length || 0;
              
              if (activeReservations >= totalSpots) {
                throw new Error('No parking spots available. All spots are currently occupied.');
              }
              
              // Validation 5: Check duplicate active reservation for same plate
              const plateScan = await dynamodb.send(new ScanCommand({
                TableName: process.env.RESERVATION_TABLE,
                FilterExpression: 'guestPlate = :plate AND endTime > :now',
                ExpressionAttributeValues: marshall({
                  ':plate': input.guestPlate.toUpperCase(),
                  ':now': nowISO
                })
              }));
              
              if (plateScan.Items && plateScan.Items.length > 0) {
                throw new Error('This license plate already has an active reservation');
              }
              
              // Validation 6: Verify resident exists
              const residentScan = await dynamodb.send(new ScanCommand({
                TableName: process.env.RESIDENT_TABLE,
                FilterExpression: 'id = :id',
                ExpressionAttributeValues: marshall({
                  ':id': input.residentId
                })
              }));
              
              if (!residentScan.Items || residentScan.Items.length === 0) {
                throw new Error('Invalid resident ID');
              }
              
              // Validation 7: Check for time overlap with existing reservations
              // Get all active reservations for this resident
              const residentReservations = await dynamodb.send(new ScanCommand({
                TableName: process.env.RESERVATION_TABLE,
                FilterExpression: 'residentId = :residentId AND endTime > :now',
                ExpressionAttributeValues: marshall({
                  ':residentId': input.residentId,
                  ':now': nowISO
                })
              }));
              
              if (residentReservations.Items && residentReservations.Items.length > 0) {
                // Check for time overlap
                for (const item of residentReservations.Items) {
                  const existingRes = unmarshall(item);
                  const existingStart = new Date(existingRes.startTime);
                  const existingEnd = new Date(existingRes.endTime);
                  
                  // Check if new reservation overlaps with existing one
                  // Overlap occurs if: newStart < existingEnd AND newEnd > existingStart
                  if (startTime < existingEnd && endTime > existingStart) {
                    throw new Error('This resident already has a reservation during this time period. Reservations cannot overlap.');
                  }
                }
              }
              
              // Create reservation
              const id = `res_${Date.now()}_${Math.random().toString(36).substring(7)}`;
              
              await dynamodb.send(new PutItemCommand({
                TableName: process.env.RESERVATION_TABLE,
                Item: marshall({
                  id,
                  residentId: input.residentId,
                  residentCode: input.residentCode.toUpperCase(),
                  residentFloor: input.residentFloor || 'N/A',
                  residentPlate: input.residentPlate || 'N/A',
                  guestPlate: input.guestPlate.toUpperCase(),
                  guestMobile: input.guestMobile,
                  guestEmail: input.guestEmail.toLowerCase(),
                  startTime: startTime.toISOString(),
                  endTime: input.endTime,
                  createdAt: nowISO,
                  updatedAt: nowISO
                })
              }));
              
              return {
                id,
                residentId: input.residentId,
                residentCode: input.residentCode.toUpperCase(),
                residentFloor: input.residentFloor || 'N/A',
                residentPlate: input.residentPlate || 'N/A',
                guestPlate: input.guestPlate.toUpperCase(),
                guestMobile: input.guestMobile,
                guestEmail: input.guestEmail.toLowerCase(),
                startTime: startTime.toISOString(),
                endTime: input.endTime,
                createdAt: nowISO,
                updatedAt: nowISO
              };
            } catch (error) {
              console.error('Error:', error);
              throw error;
            }
          };

