AWSTemplateFormatVersion: '2010-09-09'
Description: 'Parking Management System - AppSync API and DynamoDB Tables'

Parameters:
  CognitoUserPoolId:
    Type: String
    Default: ca-central-1_dBeo5yZXq
    Description: Cognito User Pool ID (already created)
  
  CognitoUserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:ca-central-1:103103683543:userpool/ca-central-1_dBeo5yZXq
    Description: Cognito User Pool ARN

Resources:
  # DynamoDB Tables
  ParkingConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ParkingConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: Name
          Value: ParkingConfig
        - Key: Project
          Value: parking-management

  ResidentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Resident
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: residentCode
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byUserId
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: byResidentCode
          KeySchema:
            - AttributeName: residentCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: Resident
        - Key: Project
          Value: parking-management

  ReservationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Reservation
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: residentId
          AttributeType: S
        - AttributeName: endTime
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byResidentId
          KeySchema:
            - AttributeName: residentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: byEndTime
          KeySchema:
            - AttributeName: endTime
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: Reservation
        - Key: Project
          Value: parking-management

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RateLimit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value: RateLimit
        - Key: Project
          Value: parking-management

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AuditLog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      Tags:
        - Key: Name
          Value: AuditLog
        - Key: Project
          Value: parking-management

  # AppSync GraphQL API
  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: parking-management-api
      AuthenticationType: API_KEY
      AdditionalAuthenticationProviders:
        - AuthenticationType: AMAZON_COGNITO_USER_POOLS
          UserPoolConfig:
            UserPoolId: !Ref CognitoUserPoolId
            AwsRegion: ca-central-1
        - AuthenticationType: AWS_IAM
      Tags:
        - Key: Name
          Value: parking-management-api
        - Key: Project
          Value: parking-management

  # API Key
  ApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Description: API Key for guest access
      Expires: 1798761600

  # GraphQL Schema (Updated v3 - Force schema refresh)
  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Definition: |
        # Schema version 3 - Pagination support
        type ParkingConfig {
          id: ID!
          name: String
          totalSpots: Int!
          updatedBy: String
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type Resident {
          id: ID!
          email: AWSEmail!
          building: String!
          floor: String!
          unitNumber: String!
          plate: String!
          residentCode: String!
          userId: String!
          deletedAt: AWSDateTime
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type Reservation {
          id: ID!
          residentId: String!
          residentCode: String!
          residentFloor: String
          residentPlate: String
          guestPlate: String!
          guestMobile: AWSPhone!
          guestEmail: AWSEmail!
          startTime: AWSDateTime!
          endTime: AWSDateTime!
          status: String
          deletedAt: AWSDateTime
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
        }

        type Query {
          getParkingConfig(id: ID!): ParkingConfig
          listParkingConfigs: [ParkingConfig]
          getResident(id: ID!): Resident
          getResidentByUserId(userId: String!): Resident
          listResidents(limit: Int, nextToken: String): ResidentConnection
          getReservation(id: ID!): Reservation
          listReservations(limit: Int, nextToken: String): ReservationConnection
          checkAvailability: AvailabilityResponse
        }

        type ResidentConnection {
          items: [Resident]
          nextToken: String
        }

        type ReservationConnection {
          items: [Reservation]
          nextToken: String
        }

        type Mutation {
          createParkingConfig(input: CreateParkingConfigInput!): ParkingConfig
          updateParkingConfig(input: UpdateParkingConfigInput!): ParkingConfig
          deleteParkingConfig(id: ID!): ParkingConfig
          createResident(input: CreateResidentInput!): Resident
          createResidentWithCognito(input: CreateResidentWithCognitoInput!): ResidentWithCredentials
          updateResident(input: UpdateResidentInput!): Resident
          deleteResident(id: ID!): Resident
          createReservation(input: CreateReservationInput!): Reservation
          updateReservation(input: UpdateReservationInput!): Reservation
          cancelReservation(id: ID!): Reservation
          deleteReservation(id: ID!): Reservation
          verifyResidentCredentials(residentCode: String!, unitNumber: String!): ResidentVerificationResult
        }

        type ResidentVerificationResult {
          isValid: Boolean!
          residentId: String
          residentFloor: String
          residentPlate: String
          message: String
        }

        type ResidentWithCredentials {
          id: ID!
          email: AWSEmail!
          building: String!
          floor: String!
          unitNumber: String!
          plate: String!
          residentCode: String!
          userId: String!
          tempPassword: String!
          createdAt: AWSDateTime!
          updatedAt: AWSDateTime!
          message: String
        }

        input CreateParkingConfigInput {
          name: String
          totalSpots: Int!
          updatedBy: String
        }

        input UpdateParkingConfigInput {
          id: ID!
          name: String
          totalSpots: Int
          updatedBy: String
        }

        input CreateResidentInput {
          email: AWSEmail!
          building: String!
          floor: String!
          unitNumber: String!
          plate: String!
          residentCode: String!
          userId: String!
        }

        input CreateResidentWithCognitoInput {
          email: AWSEmail!
          building: String!
          floor: String!
          unitNumber: String!
          plate: String!
        }

        input UpdateResidentInput {
          id: ID!
          email: AWSEmail
          building: String
          floor: String
          unitNumber: String
          plate: String
        }

        input CreateReservationInput {
          residentId: String!
          residentCode: String!
          residentFloor: String
          residentPlate: String
          guestPlate: String!
          guestMobile: AWSPhone!
          guestEmail: AWSEmail!
          startTime: AWSDateTime!
          endTime: AWSDateTime!
        }

        input UpdateReservationInput {
          id: ID!
          endTime: AWSDateTime
        }

        type AvailabilityResponse {
          available: Boolean!
          availableSpots: Int!
          totalSpots: Int!
          nextAvailableTime: AWSDateTime
          message: String!
        }

        schema {
          query: Query
          mutation: Mutation
        }

  # IAM Role for AppSync to access DynamoDB
  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ParkingConfigTable.Arn
                  - !GetAtt ResidentTable.Arn
                  - !GetAtt ReservationTable.Arn
                  - !Sub '${ParkingConfigTable.Arn}/index/*'
                  - !Sub '${ResidentTable.Arn}/index/*'
                  - !Sub '${ReservationTable.Arn}/index/*'

  # Data Sources
  ParkingConfigDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: ParkingConfigDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        TableName: !Ref ParkingConfigTable
        AwsRegion: ca-central-1

  ResidentDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: ResidentDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        TableName: !Ref ResidentTable
        AwsRegion: ca-central-1

  ReservationDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: ReservationDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        TableName: !Ref ReservationTable
        AwsRegion: ca-central-1

  # Resolvers - ParkingConfig
  GetParkingConfigResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: getParkingConfig
      DataSourceName: !GetAtt ParkingConfigDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          return {
            operation: 'GetItem',
            key: util.dynamodb.toMapValues({id: ctx.args.id}),
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  ListParkingConfigsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listParkingConfigs
      DataSourceName: !GetAtt ParkingConfigDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          return { operation: 'Scan' };
        }
        export function response(ctx) {
          return ctx.result.items;
        }

  CreateParkingConfigResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createParkingConfig
      DataSourceName: !GetAtt ParkingConfigDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          const id = util.autoId();
          const now = util.time.nowISO8601();
          return {
            operation: 'PutItem',
            key: util.dynamodb.toMapValues({id}),
            attributeValues: util.dynamodb.toMapValues({
              ...ctx.args.input,
              id,
              createdAt: now,
              updatedAt: now,
            }),
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  UpdateParkingConfigResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: updateParkingConfig
      DataSourceName: !GetAtt ParkingConfigDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          const { id, ...values } = ctx.args.input;
          
          // Validation: totalSpots must be >= 1
          if (values.totalSpots !== undefined && values.totalSpots < 1) {
            util.error('Total spots must be at least 1', 'ValidationError');
          }
          
          const updates = [];
          const names = { '#updatedAt': 'updatedAt' };
          const vals = { ':updatedAt': util.time.nowISO8601() };
          
          if (values.name) { updates.push('#name = :name'); names['#name'] = 'name'; vals[':name'] = values.name; }
          if (values.totalSpots) { updates.push('totalSpots = :totalSpots'); vals[':totalSpots'] = values.totalSpots; }
          if (values.updatedBy) { updates.push('updatedBy = :updatedBy'); vals[':updatedBy'] = values.updatedBy; }
          
          return {
            operation: 'UpdateItem',
            key: util.dynamodb.toMapValues({id}),
            update: {
              expression: 'SET #updatedAt = :updatedAt' + (updates.length ? ', ' + updates.join(', ') : ''),
              expressionNames: names,
              expressionValues: util.dynamodb.toMapValues(vals),
            },
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  DeleteParkingConfigResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: deleteParkingConfig
      DataSourceName: !GetAtt ParkingConfigDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          return {
            operation: 'DeleteItem',
            key: util.dynamodb.toMapValues({id: ctx.args.id}),
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  # Resolvers - Resident
  GetResidentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: getResident
      DataSourceName: !GetAtt ResidentDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          return {
            operation: 'GetItem',
            key: util.dynamodb.toMapValues({id: ctx.args.id}),
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  ListResidentsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listResidents
      DataSourceName: !GetAtt ResidentDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          const limit = ctx.args.limit || 50;
          const nextToken = ctx.args.nextToken || null;
          
          return { 
            operation: 'Scan',
            limit: limit,
            nextToken: nextToken,
            filter: {
              expression: 'attribute_not_exists(deletedAt)',
            }
          };
        }
        export function response(ctx) {
          return {
            items: ctx.result.items,
            nextToken: ctx.result.nextToken
          };
        }

  GetResidentByUserIdResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: getResidentByUserId
      DataSourceName: !GetAtt ResidentDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          return {
            operation: 'Query',
            index: 'byUserId',
            query: {
              expression: 'userId = :userId',
              expressionValues: util.dynamodb.toMapValues({
                ':userId': ctx.args.userId,
              }),
            },
          };
        }
        export function response(ctx) {
          if (ctx.result.items.length > 0) {
            return ctx.result.items[0];
          }
          return null;
        }

  CreateResidentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createResident
      DataSourceName: !GetAtt ResidentDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          const id = util.autoId();
          const now = util.time.nowISO8601();
          
          const code = ctx.args.input.residentCode || '';
          const email = ctx.args.input.email || '';
          
          // Validation: resident code format (6 characters alphanumeric)
          if (code.length !== 6) {
            util.error('Resident code must be exactly 6 characters', 'ValidationError');
          }
          
          // Validation: email contains @ and .
          if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
            util.error('Invalid email format', 'ValidationError');
          }
          
          return {
            operation: 'PutItem',
            key: util.dynamodb.toMapValues({id}),
            attributeValues: util.dynamodb.toMapValues({
              ...ctx.args.input,
              residentCode: code,
              email: email,
              id,
              createdAt: now,
              updatedAt: now,
            }),
            condition: {
              expression: 'attribute_not_exists(id)',
            },
          };
        }
        export function response(ctx) {
          if (ctx.error) {
            if (ctx.error.type === 'DynamoDB:ConditionalCheckFailedException') {
              util.error('Resident already exists', 'DuplicateError');
            }
            util.error(ctx.error.message, ctx.error.type);
          }
          return ctx.result;
        }

  UpdateResidentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: updateResident
      DataSourceName: !GetAtt ResidentDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          const { id, ...values } = ctx.args.input;
          const updates = [];
          const names = { '#updatedAt': 'updatedAt' };
          const vals = { ':updatedAt': util.time.nowISO8601() };
          
          if (values.email) { updates.push('email = :email'); vals[':email'] = values.email; }
          if (values.building) { updates.push('building = :building'); vals[':building'] = values.building; }
          if (values.floor) { updates.push('floor = :floor'); vals[':floor'] = values.floor; }
          if (values.unitNumber) { updates.push('unitNumber = :unitNumber'); vals[':unitNumber'] = values.unitNumber; }
          if (values.plate) { updates.push('plate = :plate'); vals[':plate'] = values.plate; }
          
          return {
            operation: 'UpdateItem',
            key: util.dynamodb.toMapValues({id}),
            update: {
              expression: 'SET #updatedAt = :updatedAt' + (updates.length ? ', ' + updates.join(', ') : ''),
              expressionNames: names,
              expressionValues: util.dynamodb.toMapValues(vals),
            },
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  DeleteResidentResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: deleteResident
      DataSourceName: !GetAtt ResidentDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          // Soft delete: set deletedAt timestamp instead of actually deleting
          return {
            operation: 'UpdateItem',
            key: util.dynamodb.toMapValues({id: ctx.args.id}),
            update: {
              expression: 'SET deletedAt = :deletedAt, #updatedAt = :updatedAt',
              expressionNames: { '#updatedAt': 'updatedAt' },
              expressionValues: util.dynamodb.toMapValues({
                ':deletedAt': util.time.nowISO8601(),
                ':updatedAt': util.time.nowISO8601()
              })
            }
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  CancelReservationResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: cancelReservation
      DataSourceName: !GetAtt ReservationDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          // Set status to cancelled and mark as deleted
          return {
            operation: 'UpdateItem',
            key: util.dynamodb.toMapValues({id: ctx.args.id}),
            update: {
              expression: 'SET #status = :status, deletedAt = :deletedAt, #updatedAt = :updatedAt',
              expressionNames: { 
                '#status': 'status',
                '#updatedAt': 'updatedAt' 
              },
              expressionValues: util.dynamodb.toMapValues({
                ':status': 'cancelled',
                ':deletedAt': util.time.nowISO8601(),
                ':updatedAt': util.time.nowISO8601()
              })
            }
          };
        }
        export function response(ctx) {
          return ctx.result;
        }

  VerifyResidentCredentialsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: verifyResidentCredentials
      DataSourceName: !GetAtt VerifyResidentCredentialsDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        import { util } from '@aws-appsync/utils';
        export function request(ctx) {
          return {
            operation: 'Invoke',
            payload: ctx,
          };
        }
        export function response(ctx) {
          if (ctx.error) {
            util.error(ctx.error.message, ctx.error.type);
          }
          return ctx.result;
        }

  # Lambda for verifyResidentCredentials with rate limiting
  VerifyResidentCredentialsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - appsync.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ResidentTable.Arn
                  - !GetAtt RateLimitTable.Arn
                  - !Sub '${ResidentTable.Arn}/index/*'
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:ca-central-1:103103683543:function:parking-verifyResidentCredentials'

  VerifyResidentCredentialsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: parking-verifyResidentCredentials
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt VerifyResidentCredentialsLambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          RESIDENT_TABLE: !Ref ResidentTable
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          AWS_REGION_NAME: !Ref AWS::Region
      Code:
        ZipFile: |
          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, GetCommand, PutCommand, UpdateCommand, QueryCommand } = require('@aws-sdk/lib-dynamodb');
          
          const dynamoClient = new DynamoDBClient({});
          const docClient = DynamoDBDocumentClient.from(dynamoClient);
          
          // Rate limit: 5 attempts per IP per 15 minutes
          const MAX_ATTEMPTS = 5;
          const WINDOW_SECONDS = 900; // 15 minutes
          
          // Extract IP from AppSync context
          const getClientIP = (ctx) => {
            return ctx?.request?.headers['x-forwarded-for']?.split(',')[0]?.trim() 
              || ctx?.request?.headers['x-real-ip'] 
              || ctx?.identity?.sourceIp 
              || 'unknown';
          };
          
          const checkRateLimit = async (key) => {
            const now = Math.floor(Date.now() / 1000);
            const ttl = now + WINDOW_SECONDS;
            
            try {
              // Try to get existing rate limit record
              const getResult = await docClient.send(new GetCommand({
                TableName: process.env.RATE_LIMIT_TABLE,
                Key: { key }
              }));
              
              if (getResult.Item) {
                const attempts = getResult.Item.attempts || 0;
                const expiresAt = getResult.Item.ttl || 0;
                
                // Check if window has expired
                if (expiresAt < now) {
                  // Reset counter
                  await docClient.send(new PutCommand({
                    TableName: process.env.RATE_LIMIT_TABLE,
                    Item: {
                      key,
                      attempts: 1,
                      ttl,
                      lastAttempt: now
                    }
                  }));
                  return { allowed: true, remaining: MAX_ATTEMPTS - 1 };
                }
                
                // Check if exceeded
                if (attempts >= MAX_ATTEMPTS) {
                  const resetIn = expiresAt - now;
                  return { 
                    allowed: false, 
                    remaining: 0,
                    resetIn 
                  };
                }
                
                // Increment counter
                await docClient.send(new UpdateCommand({
                  TableName: process.env.RATE_LIMIT_TABLE,
                  Key: { key },
                  UpdateExpression: 'SET attempts = attempts + :inc, lastAttempt = :now',
                  ExpressionAttributeValues: {
                    ':inc': 1,
                    ':now': now
                  }
                }));
                
                return { allowed: true, remaining: MAX_ATTEMPTS - attempts - 1 };
              } else {
                // First attempt
                await docClient.send(new PutCommand({
                  TableName: process.env.RATE_LIMIT_TABLE,
                  Item: {
                    key,
                    attempts: 1,
                    ttl,
                    lastAttempt: now
                  }
                }));
                return { allowed: true, remaining: MAX_ATTEMPTS - 1 };
              }
            } catch (error) {
              console.error('Rate limit check error:', error);
              // On error, allow request (fail open)
              return { allowed: true, remaining: MAX_ATTEMPTS };
            }
          };
          
          exports.handler = async (event) => {
            console.log('VerifyResidentCredentials input:', JSON.stringify(event, null, 2));
            
            try {
              const { residentCode, unitNumber } = event.arguments;
              const clientIP = getClientIP(event);
              
              // Rate limiting key: IP address + action
              const rateLimitKey = `verify:${clientIP}`;
              
              // Check rate limit
              const rateLimit = await checkRateLimit(rateLimitKey);
              
              if (!rateLimit.allowed) {
                const minutes = Math.ceil(rateLimit.resetIn / 60);
                throw new Error(`Too many attempts. Please try again in ${minutes} minute(s).`);
              }
              
              // Query using GSI byResidentCode
              const queryResult = await docClient.send(new QueryCommand({
                TableName: process.env.RESIDENT_TABLE,
                IndexName: 'byResidentCode',
                KeyConditionExpression: 'residentCode = :code',
                FilterExpression: 'unitNumber = :unit',
                ExpressionAttributeValues: {
                  ':code': residentCode.toUpperCase(),
                  ':unit': unitNumber
                }
              }));
              
              if (!queryResult.Items || queryResult.Items.length === 0) {
                return {
                  isValid: false,
                  residentId: null,
                  residentFloor: null,
                  residentPlate: null,
                  message: 'Invalid credentials'
                };
              }
              
              const resident = queryResult.Items[0];
              
              return {
                isValid: true,
                residentId: resident.id,
                residentFloor: resident.floor || 'N/A',
                residentPlate: resident.plate || 'N/A',
                message: 'Verified successfully'
              };
              
            } catch (error) {
              console.error('Error:', error);
              throw new Error(error.message || 'Verification failed');
            }
          };

