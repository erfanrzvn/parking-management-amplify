# Canonical AppSync schema. All resolvers route to lambda/api.js.
type ParkingConfig @aws_api_key @aws_cognito_user_pools {
  id: ID!
  name: String
  totalSpots: Int!
  updatedBy: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Resident @aws_cognito_user_pools {
  id: ID!
  email: AWSEmail!
  name: String
  phone: String
  building: String
  floor: String
  unitNumber: String
  plate: String
  residentCode: String!
  userId: String!
  householdId: String
  deletedAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Reservation @aws_api_key @aws_cognito_user_pools {
  householdId: String
  id: ID!
  residentId: String!
  residentCode: String!
  residentFloor: String
  residentPlate: String
  guestPlate: String!
  guestMobile: AWSPhone!
  guestEmail: AWSEmail!
  startTime: AWSDateTime!
  endTime: AWSDateTime!
  status: String
  deletedAt: AWSDateTime
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Query {
  getParkingConfig(id: ID!): ParkingConfig @aws_api_key @aws_cognito_user_pools
  listParkingConfigs: [ParkingConfig] @aws_api_key @aws_cognito_user_pools
  getResident(id: ID!): Resident @aws_cognito_user_pools
  getResidentByUserId(userId: String!): Resident @aws_cognito_user_pools
  listResidents(limit: Int, nextToken: String): ResidentConnection @aws_cognito_user_pools
  getReservation(id: ID!): Reservation @aws_cognito_user_pools
  listReservations(limit: Int, nextToken: String): ReservationConnection @aws_cognito_user_pools
  checkAvailability: AvailabilityResponse @aws_api_key @aws_cognito_user_pools
  exportResidentsCSV: String @aws_cognito_user_pools
}

type ResidentConnection @aws_cognito_user_pools {
  items: [Resident]
  nextToken: String
}

type ReservationConnection @aws_cognito_user_pools {
  items: [Reservation]
  nextToken: String
}

type CSVExportResult @aws_cognito_user_pools {
  count: Int!
  csvData: String
  message: String!
  success: Boolean!
}

type Mutation {
  exportResidentsCSV: CSVExportResult @aws_cognito_user_pools
  createParkingConfig(input: CreateParkingConfigInput!): ParkingConfig @aws_cognito_user_pools
  updateParkingConfig(input: UpdateParkingConfigInput!): ParkingConfig @aws_cognito_user_pools
  deleteParkingConfig(id: ID!): ParkingConfig @aws_cognito_user_pools
  createResident(input: CreateResidentInput!): Resident @aws_cognito_user_pools
  createResidentWithCognito(input: CreateResidentWithCognitoInput!): ResidentWithCredentials @aws_cognito_user_pools
  updateResident(input: UpdateResidentInput!): Resident @aws_cognito_user_pools
  deleteResident(id: ID!): Resident @aws_cognito_user_pools
  createReservation(input: CreateReservationInput!): Reservation @aws_api_key @aws_cognito_user_pools
  updateReservation(input: UpdateReservationInput!): Reservation @aws_cognito_user_pools
  cancelReservation(id: ID!): Reservation @aws_cognito_user_pools
  deleteReservation(id: ID!): Reservation @aws_cognito_user_pools
  verifyResidentCredentials(residentCode: String!, unitNumber: String!): ResidentVerificationResult @aws_api_key @aws_cognito_user_pools
  importResidentsCSV(csvData: String!): ImportResult @aws_cognito_user_pools
}

type ResidentVerificationResult @aws_api_key @aws_cognito_user_pools {
  isValid: Boolean!
  residentId: String
  residentFloor: String
  residentPlate: String
  message: String
}

type ResidentWithCredentials @aws_cognito_user_pools {
  id: ID!
  email: AWSEmail!
  name: String
  phone: String
  building: String!
  floor: String!
  unitNumber: String!
  plate: String!
  residentCode: String!
  userId: String!
  householdId: String
  tempPassword: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  message: String
}

input CreateParkingConfigInput {
  name: String
  totalSpots: Int!
  updatedBy: String
}

input UpdateParkingConfigInput {
  id: ID!
  name: String
  totalSpots: Int
  updatedBy: String
}

input CreateResidentInput {
  email: AWSEmail!
  name: String
  phone: String
  building: String!
  floor: String!
  unitNumber: String!
  plate: String!
}

input CreateResidentWithCognitoInput {
  email: AWSEmail!
  name: String
  phone: String
  building: String!
  floor: String!
  unitNumber: String!
  plate: String!
}

input UpdateResidentInput {
  id: ID!
  email: AWSEmail
  name: String
  phone: String
  building: String
  floor: String
  unitNumber: String
  plate: String
}

input CreateReservationInput {
  unitNumber: String!
  residentId: String
  residentCode: String!
  residentFloor: String
  residentPlate: String
  guestPlate: String!
  guestMobile: AWSPhone!
  guestEmail: AWSEmail!
  startTime: AWSDateTime!
  endTime: AWSDateTime!
}

input UpdateReservationInput {
  id: ID!
  endTime: AWSDateTime
}

type AvailabilityResponse @aws_api_key @aws_cognito_user_pools {
  available: Boolean!
  availableSpots: Int!
  totalSpots: Int!
  nextAvailableTime: AWSDateTime
  message: String!
}

type ImportedCredential @aws_cognito_user_pools {
  email: AWSEmail!
  residentCode: String!
  tempPassword: String!
}

type ImportResult @aws_cognito_user_pools {
  credentials: [ImportedCredential!]!
  success: Boolean!
  created: Int!
  updated: Int!
  failed: Int!
  errors: [String]
  message: String!
}

schema {
  query: Query
  mutation: Mutation
}
